name: Build iOS IPA (Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Prepare Clean Project for Export
        run: |
          # Удаляем редакторские плагины AI для чистого билда
          rm -rf addons
          python3 -c '
          with open("project.godot", "r") as f:
              lines = f.readlines()
          with open("project.godot", "w") as f:
              for line in lines:
                  if "_mcp_game_helper" in line or "res://addons/" in line:
                      continue
                  f.write(line)
          '

      - name: Export Godot iOS Project
        run: |
          mkdir -p export
          godot --headless --verbose --export-debug "iOS" export/satan.zip

      - name: Compile and Package IPA
        run: |
          # Компиляция в Xcode без подписи (для Sideloadly)
          xcodebuild -project export/satan.xcodeproj \
            -scheme satan \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            OTHER_LDFLAGS='$(inherited) -framework QuartzCore -framework Metal -framework MetalKit -framework UIKit -Wl,-U,_CADynamicRangeAutomatic -Wl,-U,_CADynamicRangeConstrainedHigh -Wl,-U,_CADynamicRangeHigh -Wl,-U,_CADynamicRangeStandard -Wl,-U,_MTLTensorDomain' \
            build

          # Создаем структуру IPA (Payload/*.app)
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/*.app Payload/
          zip -qr SATAN.ipa Payload
          mkdir -p ipa_output
          mv SATAN.ipa ipa_output/

      - name: Upload IPA Artifact for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: SATAN-iOS-IPA
          path: ipa_output/SATAN.ipa
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SATAN iOS IPA (v1.0.0)"
          body: "Свежая сборка SATAN для iOS (iPhone 12 Pro). Готово для установки через Sideloadly."
          files: ipa_output/SATAN.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
